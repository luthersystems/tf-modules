name: Release (tag)

# On-demand release dispatch with an explicit version. tf-modules tags are
# consumed as pinned `?ref=vX.Y.Z` module sources (sandbox-infrastructure-
# template, ui-infrastructure/env-bootstrap) — nothing is triggered BY the
# tag, so the default GITHUB_TOKEN is sufficient here (unlike reliable /
# lutherauth / buildenv, where a GITHUB_TOKEN-created tag would fail to
# trigger the downstream tag-push pipeline). Exists because direct tag
# pushes are blocked from agent sandboxes; this gives operators and agents
# a validated, auditable release button.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to tag (vMAJOR.MINOR.PATCH, e.g. v55.23.0). Without backport_sha: strictly newer than the latest tag, cut from main HEAD."
        type: string
        required: true
      backport_sha:
        description: "Patch backport only: full commit SHA built on an older release tag. version must be that tag's next patch (e.g. v52.0.3 on v52.0.2). Leave empty for a normal release."
        type: string
        required: false
        default: ""

permissions:
  contents: write # gh release create (creates the tag + release)

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  release:
    name: Cut release ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # all tags + history for validation and release notes
      - name: Validate and cut
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          BACKPORT_SHA: ${{ inputs.backport_sha }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$VERSION' is not vMAJOR.MINOR.PATCH"; exit 1; }
          if [ -n "$BACKPORT_SHA" ]; then
            # Patch backport for consumers pinned to an older major: tag a
            # commit that is not on main. The commit must descend from its
            # nearest release tag, and the version must be exactly that tag's
            # next patch, so a backport can never claim a new minor or major,
            # skip a patch, or reuse a tag.
            [[ "$BACKPORT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::backport_sha must be a full 40-character commit SHA"; exit 1; }
            git fetch --no-tags origin "$BACKPORT_SHA"
            if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
              echo "::error::$VERSION already exists"; exit 1
            fi
            base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$BACKPORT_SHA")
            [[ "$base" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::nearest tag '$base' is not vMAJOR.MINOR.PATCH"; exit 1; }
            want="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            [ "$VERSION" = "$want" ] || { echo "::error::a backport on $base must be $want, not $VERSION"; exit 1; }
            notes=$(git log "$base..$BACKPORT_SHA" --oneline --no-merges | head -40 | sed 's/^/- /')
            gh release create "$VERSION" --target "$BACKPORT_SHA" --latest=false --title "$VERSION" \
              --notes "Backport on $base."$'\n\n'"$notes"
            echo "released $VERSION at $BACKPORT_SHA (backport on $base)"
            exit 0
          fi
          latest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "latest tag: ${latest:-<none>}"
          if [ -n "$latest" ]; then
            newest=$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -1)
            { [ "$newest" = "$VERSION" ] && [ "$VERSION" != "$latest" ]; } || { echo "::error::$VERSION is not strictly newer than $latest"; exit 1; }
          fi
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo "::error::checkout is not main HEAD"; exit 1; }
          notes=$(git log "${latest:+$latest..}HEAD" --oneline --no-merges | head -40 | sed 's/^/- /')
          gh release create "$VERSION" --title "$VERSION" --notes "${notes:-Initial release}"
          echo "released $VERSION at $(git rev-parse HEAD)"

name: Terraform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Decides whether the build and test jobs must run (scripts/ci-changes.sh).
  # No paths filter on the workflow: the gate below is a required check, so
  # every PR must start a run. A docs-only PR skips the jobs instead.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      # On a pull request this checks out the merge commit. Its first parent
      # is the base branch tip, so depth 2 is enough for the diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Test the decision script and the gate's needs list
        run: bash scripts/ci-changes-test.sh
      # Only a pull request may skip. Any other event (push, merge group)
      # runs everything.
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            bash scripts/ci-changes.sh HEAD^1 HEAD | tee -a "$GITHUB_OUTPUT"
          else
            bash scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          fi

  discover:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find-modules.outputs.dirs }}
      modules_with_tests: ${{ steps.find-testable.outputs.dirs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: find-modules
        name: Discover modules
        run: |
          dirs=$(find . -maxdepth 1 -type d ! -name '.*' | sed 's|^\./||' | sort | while read -r d; do
            if ls "$d"/*.tf >/dev/null 2>&1; then
              # Skip modules with .validate-skip or tests/ (tests handle their own validation)
              [ -f "$d/.validate-skip" ] && continue
              [ -d "$d/tests" ] && continue
              echo "$d"
            fi
          done | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

      - id: find-testable
        name: Discover modules with terraform tests
        run: |
          dirs=$(find . -maxdepth 1 -type d ! -name '.*' | sed 's|^\./||' | sort | while read -r d; do
            if ls "$d"/tests/*.tftest.hcl >/dev/null 2>&1 || ls "$d"/*.tftest.hcl >/dev/null 2>&1; then
              echo "$d"
            fi
          done | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

  validate-modules:
    needs: [changes, discover]
    # An empty matrix is an error, so the job skips when no module matches.
    # The gate below allows that skip only then.
    if: needs.changes.outputs.code != 'false' && needs.discover.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ matrix.dir }}

  test-modules:
    needs: [changes, discover]
    # An empty matrix is an error, so the job skips when no module matches.
    # The gate below allows that skip only then.
    if: needs.changes.outputs.code != 'false' && needs.discover.outputs.modules_with_tests != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.modules_with_tests) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # 1.11+ for override_during = plan in the mock tests. Validate keeps
          # 1.7.5, the oldest version callers run.
          terraform_version: "1.14.9"

      - name: Terraform Init
        run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}

      - name: Terraform Test
        run: terraform test -no-color
        working-directory: ${{ matrix.dir }}

  format-check:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # 1.11+ for override_during = plan in the mock tests. Validate-modules
          # skips a module with tests/ (a module with configuration_aliases
          # does not validate alone), so such a module is not checked on
          # 1.7.5 here: keep its code to features 1.7 has.
          terraform_version: "1.14.9"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

  # The one check main's ruleset requires for this workflow
  # (common-infrastructure github-org-admin/main_protection.json). One gate
  # instead of each job by name: matrix jobs get one check per entry, and a
  # list of names in the ruleset would drift with the workflow.
  # always(), not !cancelled(): a cancelled run must fail this check. A gate
  # that is skipped counts as passed for a required check.
  # scripts/ci-changes-test.sh fails when a job is missing from needs.
  ci-all:
    name: CI (all required checks)
    if: always()
    needs: [changes, discover, validate-modules, test-modules, format-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pass only if the changes job succeeded and every other job succeeded,
      # or was skipped because the changes job said the PR is docs-only
      # (code=false). Any other skip fails, so a job skipped by mistake
      # cannot pass the gate. One exception each for validate-modules and
      # test-modules: they skip when discover found no module for their
      # matrix, which is not an error.
      - name: Fail unless every required job passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
          MODULES: ${{ needs.discover.outputs.modules }}
          TESTABLE: ${{ needs.discover.outputs.modules_with_tests }}
        run: |
          echo "$NEEDS_JSON"
          allowed=""
          if [ "$MODULES" = "[]" ]; then allowed="$allowed validate-modules"; fi
          if [ "$TESTABLE" = "[]" ]; then allowed="$allowed test-modules"; fi
          bad=$(jq -r --arg code "$CODE" --arg allowed "$allowed" '
            to_entries[]
            | .key as $k
            | select(
                (.key == "changes" and .value.result != "success")
                or .value.result == "failure"
                or .value.result == "cancelled"
                or (.value.result == "skipped" and $code != "false"
                    and (($allowed | split(" ") | index($k)) == null)))
            | "\(.key): \(.value.result)"' <<<"$NEEDS_JSON")
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::A required CI job failed, was cancelled or was skipped."
            exit 1
          fi
          echo "ok"

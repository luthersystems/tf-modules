name: Terraform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find-modules.outputs.dirs }}
      modules_with_tests: ${{ steps.find-testable.outputs.dirs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: find-modules
        name: Discover modules
        run: |
          dirs=$(find . -maxdepth 1 -type d ! -name '.*' | sed 's|^\./||' | sort | while read -r d; do
            if ls "$d"/*.tf >/dev/null 2>&1; then
              # Skip modules with .validate-skip or tests/ (tests handle their own validation)
              [ -f "$d/.validate-skip" ] && continue
              [ -d "$d/tests" ] && continue
              echo "$d"
            fi
          done | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

      - id: find-testable
        name: Discover modules with terraform tests
        run: |
          dirs=$(find . -maxdepth 1 -type d ! -name '.*' | sed 's|^\./||' | sort | while read -r d; do
            if ls "$d"/tests/*.tftest.hcl >/dev/null 2>&1 || ls "$d"/*.tftest.hcl >/dev/null 2>&1; then
              echo "$d"
            fi
          done | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

  validate-modules:
    needs: discover
    if: ${{ needs.discover.outputs.modules != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ matrix.dir }}

  test-modules:
    needs: discover
    if: ${{ needs.discover.outputs.modules_with_tests != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.modules_with_tests) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # 1.11+ for override_during = plan in the mock tests. Validate keeps
          # 1.7.5, the oldest version callers run.
          terraform_version: "1.14.9"

      - name: Terraform Init
        run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}

      - name: Terraform Test
        run: terraform test -no-color
        working-directory: ${{ matrix.dir }}

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # 1.11+ for override_during = plan in the mock tests. Validate-modules
          # skips a module with tests/ (a module with configuration_aliases
          # does not validate alone), so such a module is not checked on
          # 1.7.5 here: keep its code to features 1.7 has.
          terraform_version: "1.14.9"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

  # The one check main's ruleset requires for this workflow
  # (common-infrastructure github-org-admin/main_protection.json). Requiring
  # each job by name does not work here: matrix jobs get one check per entry,
  # so the list in the ruleset would drift each time the matrix changes. This
  # job fails when any job above failed or was cancelled, and passes when they
  # passed or were skipped, as a skipped required check does.
  # `always()`, not `!cancelled()`: a cancelled run must fail this check. With
  # `!cancelled()` the job is skipped, and GitHub counts a skipped required
  # check as passed.
  ci-all:
    name: CI (all required checks)
    if: ${{ always() }}
    needs: [discover, validate-modules, test-modules, format-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a needed job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          echo "::error::A job this check needs failed or was cancelled."
          exit 1
